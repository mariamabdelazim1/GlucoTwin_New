services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glucotwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-glucotwin-password}
      POSTGRES_DB: glucotwin
    ports:
      - "5432:5432"
    volumes:
      - glucotwin_postgres_data:/var/lib/postgresql/data
      - ./services/api/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glucotwin -d glucotwin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glucotwin_postgres_data:

