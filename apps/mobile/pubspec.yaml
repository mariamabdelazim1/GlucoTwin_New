name: glucotwin
description: Patient app for Diabetes Digital Twin
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.69.0

  # Animations
  flutter_animate: ^4.5.0

  # UI Components
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3

  # Typography
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome-monitoring.webp
    - assets/images/breakfast-log.png
